<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표 대본 따라읽기 v3 · 전우찬 · My Free Time</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --text:#1f2329; --muted:#8a919c; --read:#b3b8c0;
    --hl:#ffe94d; --hl-soft:rgba(255,233,77,.28); --red:#e53935; --amber:#f59e0b; --green:#16a34a; --line:#e4e7ee;
    --tip:#eef4ff; --tip-text:#36507a; --bar:#ffffff; --accent:#2f6fed; --shadow:rgba(20,30,60,.08);
    --sideW:380px; --barH:64px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
       }
  button,select,input{font:inherit}

  /* ---------- 상단 바 ---------- */
  #bar{position:sticky;top:0;z-index:30;background:var(--bar);border-bottom:1px solid var(--line);
       box-shadow:0 2px 10px var(--shadow)}
  .barRow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;font-size:14px}
  .btn,#bar select{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);
       border-radius:8px;padding:6px 10px;cursor:pointer}
  .btn:hover,#bar select:hover{border-color:var(--accent)}
  #micBtn{font-weight:700;font-size:15px;padding:8px 16px;background:var(--accent);color:#fff;border:none}
  #micBtn:hover{filter:brightness(1.08)}
  #micBtn.on{background:var(--red);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,.5)}50%{box-shadow:0 0 0 8px rgba(229,57,53,0)}}
  #status{color:var(--muted);min-width:90px}
  #jump{min-width:0;flex:0 1 220px}
  #fontRow{display:none}
  #status.warnTxt{color:var(--amber);font-weight:700}
  #timer{font-variant-numeric:tabular-nums;font-weight:700}
  #timer.over{color:var(--red)}
  #slideInfo{font-weight:700;color:var(--accent)}
  .spacer{flex:1}
  .barRow label{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .barRow input[type=range]{width:90px}
  #progress{height:4px;background:var(--line)}
  #progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s}

  /* 설정 팝업 */
  #settings{position:absolute;right:12px;top:calc(100% + 6px);width:min(380px,calc(100vw - 24px));background:var(--card);
       border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.22);padding:14px 16px;
       display:grid;gap:11px;font-size:14px;max-height:calc(100vh - 110px);overflow:auto}
  #settings[hidden]{display:none}
  #settings .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  #settings .row>span{color:var(--text);min-width:0}
  #settings .row .btn{flex:none}
  #settings .row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  #settings h4{margin:4px 0 0;font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
  .sw{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;
      transition:background .15s;flex:none;border:none;padding:0}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
  .sw:checked{background:var(--accent)}
  .sw:checked::after{transform:translateX(18px)}

  /* ---------- 레이아웃: 대본 + 옆 화면 ---------- */
  #layout{max-width:1560px;margin:0 auto;padding:22px 22px 0;display:grid;
          grid-template-columns:minmax(0,1fr) var(--sideW);gap:24px;align-items:start}
  body.noSide #layout{grid-template-columns:minmax(0,1fr)}
  body.noSide #side{display:none}
  body.sideS{--sideW:300px} body.sideL{--sideW:480px}
  main{width:100%;max-width:960px;margin:0 auto;padding:0 0 46vh}

  /* ---------- 옆 화면(슬라이드 미리보기) ---------- */
  #side{position:sticky;top:calc(var(--barH) + 14px);display:flex;flex-direction:column;gap:12px;
        max-height:calc(100vh - var(--barH) - 70px);overflow:auto;padding:2px 2px 8px;scrollbar-width:thin}
  .sideCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;
        box-shadow:0 2px 12px var(--shadow);transition:border-color .2s,box-shadow .2s}
  .sideHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .sideTag{font-size:12px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--accent);
        border-radius:999px;padding:2px 10px}
  #nextCard .sideTag{background:var(--muted)}
  #sideNo{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  .imgWrap{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
  .imgWrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .imgWrap img.pop{animation:pop .35s ease-out}
  @keyframes pop{from{opacity:.25;transform:scale(.985)}to{opacity:1;transform:none}}
  .sideCap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:9px;flex-wrap:wrap}
  #capName{font-weight:800;font-size:15px}
  #cue{margin-top:9px;font-size:13px;line-height:1.5;color:var(--tip-text);background:var(--tip);border-radius:9px;padding:7px 10px}
  body.noTips #cue{display:none}
  #nextCard{display:grid;grid-template-columns:44% 1fr;gap:12px;align-items:center;position:relative}
  #nextCard .nTxt{min-width:0}
  #nextCard .nTxt .sideTag{display:inline-block}
  #nextName{font-weight:700;font-size:14px;margin-top:6px}
  #nextText{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;
        -webkit-box-orient:vertical;overflow:hidden}
  #nextCard.armed{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,57,53,.22),0 6px 22px rgba(229,57,53,.25);animation:glow 1s infinite}
  #nextCard.armed .sideTag{background:var(--red)}
  #nextCard.soft{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
  #nextCard.soft .sideTag{background:var(--amber)}
  @keyframes glow{0%,100%{box-shadow:0 0 0 3px rgba(229,57,53,.22),0 6px 22px rgba(229,57,53,.25)}50%{box-shadow:0 0 0 6px rgba(229,57,53,.1),0 6px 22px rgba(229,57,53,.1)}}
  #strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  #strip button{position:relative;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;
        background:var(--card);aspect-ratio:16/9;opacity:.78;transition:opacity .15s,border-color .15s}
  #strip button img{width:100%;height:100%;object-fit:cover;display:block}
  #strip button b{position:absolute;left:3px;top:3px;font-size:10.5px;line-height:1;background:rgba(20,24,34,.72);color:#fff;
        border-radius:5px;padding:2px 5px;font-weight:700}
  #strip button:hover{opacity:1}
  #strip button.cur{border-color:var(--accent);opacity:1;box-shadow:0 2px 10px rgba(47,111,237,.35)}
  #strip button.done::after{content:"✓";position:absolute;right:3px;bottom:2px;font-size:11px;color:#fff;background:var(--green);
        border-radius:50%;width:15px;height:15px;line-height:15px;text-align:center;font-weight:800}

  /* ---------- 방향키 알림 ---------- */
  #nextAlert{position:fixed;left:calc(50% - (var(--sideW) + 24px)/2);top:calc(var(--barH) + 12px);transform:translateX(-50%);z-index:35;background:var(--red);color:#fff;
       font-weight:800;font-size:24px;padding:12px 26px;border-radius:14px;display:none;white-space:nowrap;
       box-shadow:0 8px 26px rgba(229,57,53,.4);animation:blink 1s infinite;pointer-events:none}
  #nextAlert.show{display:block}
  body.noSide #nextAlert{left:50%}
  #nextAlert.soft{background:var(--amber);color:#2b1d00;font-size:19px;box-shadow:0 8px 22px rgba(245,158,11,.35);animation:none}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
  #jumpHint{position:fixed;left:18px;bottom:58px;z-index:35;display:none;background:var(--accent);color:#fff;border:none;
       font-weight:700;font-size:16px;padding:11px 18px;border-radius:12px;cursor:pointer;box-shadow:0 8px 22px rgba(47,111,237,.4);max-width:calc(100vw - 36px);text-align:left}
  #jumpHint.undo{background:#475569;box-shadow:0 8px 22px rgba(71,85,105,.4)}
  #jumpHint.show{display:block;animation:pop .3s ease-out}

  /* ---------- 대본 본문 ---------- */
  .sec{background:var(--card);border:1px solid var(--line);border-radius:16px;
       padding:20px 26px;margin:0 0 18px;transition:border-color .2s,box-shadow .2s}
  .sec.activeSec{border-color:var(--accent);box-shadow:0 4px 18px rgba(47,111,237,.15)}
  .secHead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .secLabel{font-weight:800;color:var(--accent);font-size:15px}
  .secTitle{font-weight:700;font-size:16px}
  .tip{background:var(--tip);color:var(--tip-text);border-radius:10px;padding:8px 12px;
       font-size:14px;line-height:1.55;margin:6px 0 12px}
  body.noTips .tip{display:none}
  .partTitle{font-size:20px;font-weight:800;margin:34px 4px 12px}
  .sent{font-size:var(--fs,28px);line-height:1.75;margin:4px 0;padding:2px 8px;border-radius:8px;transition:background .15s,opacity .2s}
  .w{cursor:pointer;border-radius:5px;padding:0 1px;transition:color .15s,background .12s}
  .w:hover{outline:1px dashed var(--muted)}
  .w.x{cursor:default} .w.x:hover{outline:none}
  body.dimRead .w.read{color:var(--read)}
  .endBadge{display:none;margin-top:8px;font-weight:800;color:var(--red);font-size:18px}
  .endBadge.show{display:block;animation:blink 1s infinite}
  /* 표시 방식: 형광펜 */
  body.m-hl .sent.active, body.m-both .sent.active{background:var(--hl-soft)}
  body.m-hl .w.cur, body.m-both .w.cur{background:var(--hl);color:#111}
  /* 표시 방식: 빨간 줄 */
  body.m-ul .sent.active{box-shadow:inset 4px 0 0 var(--red)}
  body.m-ul .w.cur, body.m-both .w.cur{text-decoration:underline;text-decoration-color:var(--red);
       text-decoration-thickness:4px;text-underline-offset:7px}
  body.m-ul .w.cur{color:var(--red);font-weight:700}
  /* 집중 모드: 지금 읽는 문장과 다음 문장만 또렷하게 */
  body.focusMode .sec:not(.activeSec){opacity:.32}
  body.focusMode .activeSec .sent:not(.active):not(.nextSent){opacity:.38}

  /* ---------- 하단: 들린 말 ---------- */
  #heard{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);
         border-top:1px solid var(--line);padding:8px 16px;font-size:14px;color:var(--muted);
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #heardInterim{opacity:.6;font-style:italic}
  body.noHeard #heard{display:none}
  #warn{display:none;max-width:980px;margin:14px auto 0;padding:12px 16px;border-radius:10px;
        background:#fff3cd;color:#7a5b00;font-size:15px}
  #help{font-size:14px;color:var(--muted);line-height:1.8}
  #help b{color:var(--text)}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;color:var(--text)}

  /* ---------- 좁은 화면(태블릿 세로/휴대폰): 옆 화면 → 위쪽 고정 ---------- */
  @media (max-width:980px){
    #layout{grid-template-columns:minmax(0,1fr);padding:0 12px;gap:0}
    #side{order:-1;top:var(--barH);z-index:20;display:grid;grid-template-columns:minmax(0,300px) minmax(0,250px);justify-content:center;gap:8px;max-height:none;overflow:visible;
          background:var(--bg);padding:8px 12px;margin:0 -12px;border-bottom:1px solid var(--line)}
    body.noSide #side{display:none}
    .sideCard{padding:8px;border-radius:12px}
    .sideHead{margin-bottom:5px}
    #strip,#cue,#nextText{display:none}
    #nextCard{grid-template-columns:1fr;gap:5px}
    #capName{font-size:13px}
    main{padding-top:14px}
    .sec{padding:16px 16px}
    #nextAlert{font-size:20px;top:auto;bottom:54px;left:50%}
  }
  @media (max-width:700px){
    .lbl{display:none}
    #fontLabel{display:none} #fontRow{display:flex}
    #jump{flex:1 1 120px}
  }
  @media (max-width:560px){
    .barRow{padding:8px 10px;gap:6px 8px}
    #layout{padding:0 8px}
    #side{margin:0 -8px;padding-left:8px;padding-right:8px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  }
  /* 키 작은 노트북 화면: 옆 화면이 세로로 넘치지 않게 압축 */
  @media (min-width:981px) and (max-height:860px){ #strip{grid-template-columns:repeat(6,1fr);gap:5px} #side{gap:9px} }
  @media (min-width:981px) and (max-height:740px){ #cue{display:none} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} html{scroll-behavior:auto} }
</style>
</head>
<body class="m-both dimRead">

<header id="bar">
  <div class="barRow">
    <button id="micBtn">🎤 시작</button>
    <button class="btn" id="retryBtn" title="위치·음성 인식을 모두 처음부터 다시 시작">🔄<span class="lbl"> 재시도</span></button>
    <span id="status">대기 중</span>
    <span id="timer" title="발표 경과 시간 (마이크 켠 동안)">00:00</span>
    <span id="slideInfo">Slide 1 / 11</span>
    <div class="spacer"></div>
    <label id="fontLabel">글자 <input type="range" id="fontSize" min="18" max="52" value="28"></label>
    <select id="jump" title="슬라이드/질문으로 이동"></select>
    <button class="btn" id="settingsBtn" title="설정">⚙<span class="lbl"> 설정</span></button>
    <button class="btn" id="resetBtn" title="처음으로">⟲<span class="lbl"> 처음으로</span></button>
  </div>
  <div id="progress"><i></i></div>
  <div id="settings" hidden>
    <h4>표시</h4>
    <label class="row" id="fontRow"><span>글자 크기</span><input type="range" id="fontSize2" min="18" max="52" value="28"></label>
    <label class="row"><span>하이라이트 방식</span>
      <select id="hlMode">
        <option value="both">형광펜 + 빨간줄</option>
        <option value="hl">형광펜만</option>
        <option value="ul">빨간 밑줄만</option>
      </select></label>
    <label class="row"><span>옆 화면에 PPT 슬라이드 보기<small>(P) 지금 읽는 부분의 슬라이드를 옆에 띄워요</small></span><input type="checkbox" class="sw" id="swSide"></label>
    <label class="row"><span>옆 화면 크기</span>
      <select id="sideSize"><option value="S">작게</option><option value="M">보통</option><option value="L">크게</option></select></label>
    <label class="row"><span>집중 모드<small>(F) 읽는 문장 외에는 흐리게</small></span><input type="checkbox" class="sw" id="swFocus"></label>
    <label class="row"><span>발표 팁(화면·손짓) 보기</span><input type="checkbox" class="sw" id="swTips"></label>
    <label class="row"><span>하단 '들린 말' 보기<small>(H)</small></span><input type="checkbox" class="sw" id="swHeard"></label>
    <h4>동작</h4>
    <label class="row"><span>자동 스크롤</span><input type="checkbox" class="sw" id="swScroll"></label>
    <label class="row"><span>슬라이드 끝 알림 소리/진동<small>화면을 안 보고 말할 때 유용해요 (기본 꺼짐)</small></span><input type="checkbox" class="sw" id="swBeep"></label>
    <h4>음성 인식</h4>
    <label class="row"><span>인식 언어(억양)<small>잘 안 맞으면 바꿔 보세요</small></span>
      <select id="lang"><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="en-AU">English (AU)</option><option value="en-IN">English (India)</option></select></label>
    <label class="row"><span>한 단어 앞서 표시<small>인식이 늦게 오는 만큼 지금 읽을 단어에 표시해요 (같은 문장 안에서만)</small></span><input type="checkbox" class="sw" id="swLead"></label>
    <div class="row"><span>위치를 잃었을 때<small>(R) 최근 들린 말로 대본 어디인지 다시 찾기</small></span><button class="btn" id="resyncBtn">📍 다시 찾기</button></div>
  </div>
</header>

<div id="nextAlert">➡ 방향키(→) 클릭!</div>
<button id="jumpHint"></button>

<div id="layout">
  <main id="script"><div id="warn"></div></main>

  <aside id="side" aria-label="PPT 슬라이드 미리보기">
    <div class="sideCard" id="curCard">
      <div class="sideHead"><span class="sideTag">지금 화면</span><span id="sideNo">1 / 11</span></div>
      <div class="imgWrap"><img id="curImg" alt="현재 슬라이드"></div>
      <div class="sideCap"><span id="capName"></span></div>
      <div id="cue"></div>
    </div>
    <div class="sideCard" id="nextCard">
      <div class="imgWrap"><img id="nextImg" alt="다음 슬라이드"></div>
      <div class="nTxt"><span class="sideTag" id="nextTag">다음 화면</span><div id="nextName"></div><div id="nextText"></div></div>
    </div>
    <div id="strip"></div>
  </aside>
</div>

<footer id="heard"><b>🎧 들린 말:</b> <span id="heardFinal"></span> <span id="heardInterim"></span></footer>

  tip:"🖥 화면: 1. Watching YouTube | ★ No Tiredness<br>👉 오른쪽 컬러로 켜진 3번 사진(초록색 배터리 충전)을 보며 말한 뒤 (→) 클릭!",

const CANON = {"two":"to","too":"to","four":"for","there":"their","theyre":"their","eye":"i","won":"one",
  "weak":"week","ok":"okay","v":"five","alright":"all",
  // 이름(Jeon Woo-chan) — 인식기가 가장 자주 틀리는 부분
  "john":"jeon","jon":"jeon","joan":"jeon","jun":"jeon","jean":"jeon","juan":"jeon","chon":"jeon","jeong":"jeon","joe":"jeon","jong":"jeon","gene":"jeon",

const NAME = new Set(["jeon","woo","chan"]);

function norm(word){
  const w = String(word).toLowerCase().replace(/[’'`]/g,"")
      .replace(/([a-z])(\d)/g,"$1 $2").replace(/(\d)([a-z])/g,"$1 $2")
      .replace(/[^a-z0-9]+/g," ").trim();

    if(NUM[x]) x = NUM[x];
    if(x.length>3 && /[^su]s$/.test(x) && !/is$/.test(x)) x = x.slice(0,-1);   // games ↔ game
    return CANON[x] || x;
  });
}

/* ---------- 단어 유사도 (0 = 다른 단어, 1 = 같음) ---------- */
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    const t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
const phMemo=new Map(), simMemo=new Map();
// 소리가 비슷한 단어끼리 같은 키가 되도록 단순화 (tired≈tried, fun≈fan, graphics≈grafiks)
function phon(w){
  let r=phMemo.get(w); if(r!==undefined) return r;
  r=w.replace(/^kn/,"n").replace(/^wr/,"r").replace(/^wh/,"w").replace(/ph/g,"f").replace(/ck/g,"k")
     .replace(/c(?=[eiy])/g,"s").replace(/[cq]/g,"k").replace(/x/g,"ks").replace(/z/g,"s").replace(/dg/g,"j")
     .replace(/tch/g,"ch").replace(/gh/g,"").replace(/th/g,"t").replace(/(.)\1+/g,"$1");
  r=r.charAt(0)+r.slice(1).replace(/[aeiouyhw]/g,"");
  if(phMemo.size>20000) phMemo.clear();
  phMemo.set(w,r); return r;
}
function sim(a,b){
  if(a===b) return 1;
  const key=a<b? a+"|"+b : b+"|"+a; let v=simMemo.get(key); if(v!==undefined) return v;
  const s=a.length<=b.length?a:b, l=a.length<=b.length?b:a, pa=phon(a), pb=phon(b);
  if(s.length>=4 && l.startsWith(s) && l.length-s.length<=3) v=0.85;                       // watch ↔ watching
  else if(pa===pb && pa.length>=2 && s.length>=3) v=0.85;                                   // 소리가 같음
  else if(s.length>=4 && lev(a,b)/l.length<=0.3) v=0.7;                                     // 철자가 거의 같음
  else if(Math.min(pa.length,pb.length)>=3 && lev(pa,pb)/Math.max(pa.length,pb.length)<=0.25) v=0.7;
  else v=0;
  if(simMemo.size>60000) simMemo.clear();
  simMemo.set(key,v); return v;
}

/* ---------- 대본 → 모델 (토큰/문장/섹션 구조) ---------- */
function makeModel(DATA){
  const tokens=[], sents=[], secs=[], blocks=[];
  DATA.forEach(d=>{
    if(d.type!=="slide"){ blocks.push({kind:d.type, data:d}); return; }
    const secIdx=secs.length;
    const sec={first:tokens.length,last:-1,data:d,sents:[],idx:secIdx};
    d.lines.forEach(line=>{
      const sentIdx=sents.length;
      const sent={first:tokens.length,last:-1,sec:secIdx,idx:sentIdx,parts:[]};
      line.split(/\s+/).filter(Boolean).forEach(part=>{
        const nt=norm(part), rec={text:part,first:-1,last:-2};
        if(nt.length){
          rec.first=tokens.length; rec.last=tokens.length+nt.length-1;
          nt.forEach(t=>tokens.push({t, sent:sentIdx, sec:secIdx, part:sent.parts.length, starts:tokens.length===sent.first}));
        }
        sent.parts.push(rec);
      });
      sent.last=tokens.length-1;
      sents.push(sent); sec.sents.push(sentIdx);
    });
    sec.last=tokens.length-1;
    secs.push(sec); blocks.push({kind:d.type, sec:secIdx, data:d});
  });
  const N=tokens.length;
  const vocab=new Set(tokens.map(k=>k.t));
  const df=new Map(); tokens.forEach(k=>df.set(k.t,(df.get(k.t)||0)+1));
  const rare=new Set([...df].filter(([t,n])=>n<=2 && !STOP.has(t) && !NAME.has(t) && t.length>=4).map(x=>x[0]));
  tokens.forEach(k=>{
    const name=NAME.has(k.t), stop=STOP.has(k.t), short=k.t.length<=3;
    const c=name?"name":stop?"stop":short?"short":"content";
    k.pm=P.pm[c]; k.pmis=P.pmis[c];
    k.w = name?0.6 : stop?0.35 : short?0.6 : 1;           // (표시/통계용) 내용어일수록 중요
  });
  return {tokens, sents, secs, blocks, N, vocab, rare};
}

/* ---------- 들린 말 정리 ---------- */
// "you tube"→"youtube", "play station"→"playstation", "g t a"→"gta", "triple eight"→"triple a", "openworld"→"open world"
function prep(ws, vocab){
  const out=[];
  ws=ws.filter(w=>!FILLER.has(w));
  for(let i=0;i<ws.length;i++){
    if(out[out.length-1]==="triple" && (ws[i]==="eight"||ws[i]==="ay"||ws[i]==="a")){ out.push("a"); continue; }
    let hit=false;
    for(let k=3;k>=2&&!hit;k--){
      if(i+k>ws.length) continue;
      const c=ws.slice(i,i+k).join("");
      if((c.length>=5||k===3) && vocab.has(c)){ out.push(c); i+=k-1; hit=true; }
    }
    if(hit) continue;
    const w=ws[i];
    if(w.length>=6 && !vocab.has(w)){                       // "openworld" → open world
      let done=false;
      for(let c=3;c<=w.length-3&&!done;c++){
        const a=w.slice(0,c), b=w.slice(c);
        if(vocab.has(a)&&vocab.has(b)){ out.push(a,b); done=true; }
      }
      if(done) continue;
    }
    out.push(w);
  }
  return out;
}

/* ---------- 위치 추적기 (확률 기반) ----------
   "대본 몇 번째 단어까지 읽었나?"를 확률 분포(belief)로 들고 있다가, 들린 단어가 올 때마다 갱신합니다.
   · 한 단어씩 정상 진행        · 단어를 건너뜀(인식 누락/실제로 건너뜀)
   · 틀린 단어가 끼어듦         · 틀린 단어로 바뀜(대체)
   · 읽던 문장을 다시 읽음/점프  → 모두 확률적으로 처리하므로 위치를 잃지 않습니다.            */
const P = {
  adv:0.80,                       // 다음 단어로 정상 진행
  skip:[0, 0.07, 0.025, 0.012, 0.006],   // k개 건너뛰고 진행 (k=1..4)
  ins:0.04, insRep:0.30,          // 끼어든 단어 / 같은 단어 반복(말더듬)
  jumpFar:2e-4, jumpNear:8e-3, jumpScale:14, startBoost:5, jumpCtx:3, jumpRare:3, jumpNoCtx:0.5, // 어디서든/가까운 곳으로 다시 읽기
  K:4,
  pm:  {name:0.55, stop:0.82, short:0.85, content:0.90},   // 맞게 들릴 확률
  pmis:{name:0.40, stop:0.22, short:0.16, content:0.10},   // 틀린 단어가 들렸어도 이 자리일 확률(대체 오류)
  gate:true, gateFrac:0.3,        // (아래 설명) 핵심 단어가 최소 몇 %는 맞아야 앞으로 이동 허용
                       // 대본 핵심 단어가 하나도 안 들렸는데 앞으로만 가려는 경우는 잡음으로 무시
  rare:0.45                       // 대본에 1~2번만 나오는 내용어가 들렸다면 우연일 가능성이 낮음 → 틀린 자리 판정 완화
};

class Tracker{
  constructor(model, opt){
    this.m=model; this.N=model.N; this.T=model.tokens; this.vocab=model.vocab; this.rare=model.rare;
    this.o=Object.assign({backTol:3, pickAlt:"logz", xEv:8, xLen:10, xChunks:2, sEv:3, sLen:7, sMass:0.5, nextOpen:10, prevOpen:4, lostRate:0.65}, opt||{});
    this.ihi=0;
    this.secs=model.secs; this.allow=null; this.pend=null; this.sugg=null; this.autoCross=null;
    this.b=new Float64Array(this.N+1); this.nb=new Float64Array(this.N+1);
    this.candMemo=new Map();
    this.reset(0);
  }
  reset(p){ this.setPos(p||0); this.rate=0.8; this.recent=[]; }
  setPos(p){
    p=Math.max(0,Math.min(this.N,Number.isFinite(+p)?(+p|0):0)); this.pend=null; this.sugg=null; this.autoCross=null;
    this.b.fill(0); this.b[p]=1; this.pos=p; this.last=null; this.stall=0; this.rate=0.8; this.n=0; this.ihi=p;
  }
  /* 정규화 + 정리: 문자열 → 단어 배열 */
  words(text){
    return prep(String(text).split(/\s+/).filter(Boolean).flatMap(norm), this.vocab);
  }
  cands(h){            // h 와 소리/철자가 비슷한 대본 토큰 위치들
    let c=this.candMemo.get(h);
    if(!c){ if(this.candMemo.size>1500) this.candMemo.clear(); c=[]; for(let j=0;j<this.N;j++){ const q=sim(h,this.T[j].t); if(q>0) c.push([j,q]); } this.candMemo.set(h,c); }
    return c;
  }
  /* 한 단어 h 를 반영한 새 belief 를 만든다 (in: b, out: nb). 반환: 정규화 전 합(=이 단어의 증거) */
  step(b, nb, h, rep, prev){
    const N=this.N, T=this.T, K=P.K;
    nb.fill(0);
    let tot=0;
    const g=this.rare.has(h)?P.rare:1;
    for(let s=0;s<=N;s++){
      const p=b[s]; if(p<1e-14) continue; tot+=p;
      // 끼어든 단어(인식 잡음/말더듬): 위치 그대로
      nb[s]+=p*(rep?P.insRep:P.ins);
      if(s===N) continue;
      // k개 건너뛰고(0=정상) 단어 하나를 소비
      for(let k=0;k<=K && s+k<N;k++){
        const t=T[s+k], q=sim(h,t.t);
        let e;
        if(q>0) e=t.pm*q;
        else if(k===0) e=t.pmis*g;
        else continue;
        nb[s+k+1]+=p*(k===0?P.adv:P.skip[k])*e;
      }
    }
    // 점프: 읽던 곳을 다시 읽거나 다른 곳으로 이동
    const cs=this.cands(h);
    for(let c=0;c<cs.length;c++){
      const j=cs[c][0], q=cs[c][1], t=T[j];
      if(this.allow && !this.allow[t.sent]) continue;      // 문장 고정: 허용된 문장 밖으로는 점프하지 않음
      let near=0;
      const lo=Math.max(0,j-45), hi=Math.min(N,j+45);
      for(let s=lo;s<=hi;s++){ const p=b[s]; if(p>1e-14) near+=p*Math.exp(-Math.abs(j-s)/P.jumpScale); }
      let w=P.jumpFar*tot + P.jumpNear*near;
      // 문맥: 직전에 들린 단어도 대본의 바로 앞 단어와 닮아야 '진짜 이동'으로 본다 (I, my 같은 흔한 단어 하나로는 튀지 않게)
      if(t.starts) w*=P.startBoost;
      else if(prev!=null && j>0 && T[j-1].sent===t.sent && sim(prev,T[j-1].t)>0) w*=P.jumpCtx;
      else if(this.rare.has(h)) w*=P.jumpRare;                         // 대본에 1~2번만 나오는 단어는 그 자체로 강한 단서
      else w*=P.jumpNoCtx;
      nb[j+1]+=w*t.pm*q;
    }
    let z=0; for(let s=0;s<=N;s++) z+=nb[s];
    if(!(z>1e-300) || !isFinite(z)){ // 완전히 설명 불가(또는 계산 이상): 현재 분포 유지
      for(let s=0;s<=N;s++) nb[s]=b[s];
      return 1e-6;
    }
    const inv=1/z; for(let s=0;s<=N;s++) nb[s]*=inv;
    return z/(tot||1);
  }
  /* 단어열을 순서대로 반영. b0 에서 시작해 새 belief 와 로그증거를 돌려준다 */
  run(b0, ws, last){
    let b=Float64Array.from(b0), nb=new Float64Array(this.N+1), logz=0, prev=last;
    for(let i=0;i<ws.length;i++){
      const z=this.step(b,nb,ws[i], prev===ws[i], prev);
      logz+=Math.log(z); prev=ws[i];
      const t=b; b=nb; nb=t;
    }
    return {b, logz};
  }
  argmax(b){
    let best=0, bv=-1;
    for(let s=0;s<=this.N;s++) if(b[s]>bv){ bv=b[s]; best=s; }
    return best;
  }
  /* 오류가 났을 때 현재 위치를 유지한 채 내부 상태만 깨끗하게 */
  safeReset(){ try{ this.setPos(this.pos); }catch(e){ this.setPos(0); } this.recent=[]; }
  mass(b,p,r){ let m=0; for(let s=Math.max(0,p-r);s<=Math.min(this.N,p+r);s++) m+=b[s]; return m; }
  /* 들린 단어 중 '핵심 단어'(관사·전치사 같은 흔한 말 제외)가 대본 [lo,hi] 구간의 단어와 닮았는가 */
  hasContent(ws, lo, hi){
    lo=Math.max(0,lo); hi=Math.min(this.N-1,hi);
    const need=Math.max(1,Math.floor(ws.length*P.gateFrac));
    let n=0;
    for(const h of ws){
      if(h.length<3 || STOP.has(h)) continue;
      for(let j=lo;j<=hi;j++) if(sim(h,this.T[j].t)>0){ if(++n>=need) return true; break; }
    }
    return false;
  }
  /* 핵심 단어는 없어도(and on my / in my 처럼 관사·전치사뿐인 문장 첫머리), 끝의 2~3단어가 대본 바로 앞 단어들과 순서까지 똑같이 이어지면 진짜 읽는 중 */
  seqMatch(ws,np){
    const m=Math.min(ws.length,3); if(m<2) return false;
    for(let i=0;i<m;i++){ const j=np-1-i; if(j<0 || ws[ws.length-1-i]!==this.T[j].t) return false; }
    return true;
  }
  isNoise(ws, np){
    if(!P.gate || !(np>this.pos) || np>this.pos+ws.length+3) return false;
    if(ws.length>=2) return !this.hasContent(ws, this.pos-3, np+2) && !this.seqMatch(ws,np);
    // 한 단어만 들렸을 때: 대본 근처 어디와도 안 닮았으면 잡음 (교수님 질문 같은 말 한마디에 빨간줄이 앞서 튀지 않게)
    const h=ws[0], lo=Math.max(0,this.pos-3), hi=Math.min(this.N-1,np+2);
    for(let j=lo;j<=hi;j++) if(sim(h,this.T[j].t)>0) return false;
    return true;
  }
  /* ---- 슬라이드 고정(다른 슬라이드 대본으로 잘못 튀는 것 방지) ----
     지금 위치 근처 구역(현재 슬라이드, 끝이 가까우면 다음 슬라이드, 막 시작했으면 이전 슬라이드)만 '허용'.
     허용 밖으로 가려면 핵심 단어가 8개 이상 맞아야 하고(보통 두 조각 연속이거나 10단어 이상 긴 문장),
     아직 부족하면 이동하지 않고 '○번 대본 같아요' 제안만 합니다. */
  allowedFor(pos){
    const S=this.m.sents, T=this.T, N=this.N, al=new Uint8Array(S.length);
    const a=T[Math.max(0,Math.min(pos-1,N-1))].sent; al[a]=1;
    const b=T[Math.min(pos,N-1)].sent; al[b]=1;                       // 문장 경계에 있을 땐 다음 문장도
    const left=S[a].last-(pos-1);                                      // 현재 문장에서 남은 단어 수
    if(left<=this.o.nextOpen && a+1<S.length) al[a+1]=1;               // 끝이 가까우면 다음 문장 허용
    if(pos-S[a].first<=this.o.prevOpen && a>0) al[a-1]=1;              // 막 시작했으면 이전 문장도 허용(정정)
    return al;
  }
  isCross(np, al){          // 방금 읽은 단어(np-1번째)가 허용 문장 밖이면 '다른 문장으로 이동'
    return !al[this.T[Math.max(0,Math.min(np-1,this.N-1))].sent];
  }
  secAt(np){ const T=this.T; return T[Math.max(0,Math.min(np-1,this.N-1))].sec; }
  evidence(ws, np){        // 들린 핵심 단어 중, np 바로 앞 대본과 닮은 단어 수
    const lo=Math.max(0,np-ws.length-4), hi=Math.min(this.N-1,np+1); let n=0;
    for(const h of ws){
      if(h.length<3 || STOP.has(h)) continue;
      for(let j=lo;j<=hi;j++) if(sim(h,this.T[j].t)>0){ n++; break; }
    }
    return n;
  }
  /* 허용 구역 밖에 남아 있는 아주 작은 확률도 지운다 (안 지우면 "이 구역 말 같지 않다"는 증거가 쌓일 때 그쪽으로 몰래 커져 버림) */
  mask(b, al){
    const T=this.T, N=this.N, out=new Float64Array(N+1); let sum=0;
    for(let s=0;s<=N;s++){ if(b[s]>0 && al[T[Math.max(0,Math.min(s-1,N-1))].sent]){ out[s]=b[s]; sum+=b[s]; } }
    if(sum<1e-9){ out.fill(0); out[Math.min(this.pos,N)]=1; sum=1; }
    for(let s=0;s<=N;s++) out[s]/=sum;
    return out;
  }
  pick(alts, allow){
    this.allow=allow; let best=null;
    const b0 = allow ? this.mask(this.b, allow) : this.b;
    for(let a=0;a<alts.length;a++){
      const w=this.words(alts[a]);
      if(!w.length) continue;
      const r=this.run(b0,w,this.last);
      const score = this.o.pickAlt==="first" ? (a===0?1:0) : r.logz;
      if(!best||score>best.score) best={score,w,r};
    }
    this.allow=null; return best;
  }
  /* 확정(final) 결과 처리: 후보(alternatives) 중 대본과 가장 잘 맞는 문장을 고른다 */
  final(alts){
    if(typeof alts==="string") alts=[alts];
    if(!Array.isArray(alts) || !alts.length) return [];
    const al=this.allowedFor(this.pos);
    let best=this.pick(alts,null);
    if(!best) return [];
    let np=this.argmax(best.r.b);
    this.autoCross=null; let held=false;
    if(this.isCross(np,al)){                                   // 허용 문장 밖(다른 문장/슬라이드)으로 가려는 경우
      const sec=this.secAt(np), E=this.evidence(best.w,np);
      const curSec=this.secAt(this.pos), big=sec!==curSec;      // 다른 슬라이드로 가나, 같은 슬라이드 안의 다른 문장인가
      const same=this.pend && Math.abs(np-this.pend.np)<=16;
      const Et=(same?this.pend.E:0)+E, chunks=(same?this.pend.chunks:0)+1;
      const strong = big
        ? (Et>=this.o.xEv && (chunks>=this.o.xChunks || best.w.length>=this.o.xLen) && this.mass(best.r.b,np,2)>=0.6)
        : (Et>=this.o.sEv && (chunks>=2 || best.w.length>=this.o.sLen) && this.mass(best.r.b,np,2)>=this.o.sMass);
      if(strong){
        this.pend=null; this.sugg=null;
        if(big) this.autoCross={from:this.pos,to:np};          // (UI: "되돌리기" 용)
      } else {                                                 // 이동하지 않고, 허용 구역 안에서만 해석
        this.pend={sec,np,E:Et,chunks,miss:0};
        this.sugg = (big && Et>=3) ? {np,sec,E:Et} : null;
        best=this.pick(alts,al) || best;
        np=this.argmax(best.r.b);
        held=true;
      }
    } else if(this.pend){
      if(++this.pend.miss>=2){ this.pend=null; this.sugg=null; }
    }
    this.n+=best.w.length;
    if(held && Math.abs(np-this.pos)>best.w.length+8) np=this.pos, this.hold=true;   // 다른 슬라이드 말로 의심되는 조각은 현재 슬라이드 안에서도 크게 움직이지 않음
    else this.hold=false;
    if(this.hold || this.isNoise(best.w,np)){                 // 대본과 무관한 말(교수님 질문·잡담 등): 위치는 그대로, 들은 말만 기록
      this.recent=this.recent.concat(best.w).slice(-14);
      for(const h of best.w) this.rate=this.rate*0.9;
      this.ihi=this.pos; this.recover();
      return best.w;
    }
    this.b=best.r.b; this.last=best.w[best.w.length-1];
    if(np<this.pos){                                         // 뒤로 가는 경우
      if(this.pos-np<=this.o.backTol) np=this.pos;           // 1~2단어 뒤로 밀리는 건 인식 오차로 보고 무시
      else if(this.mass(this.b,np,2)<0.55) np=this.pos;      // 확실할 때만 되돌아가기
    }
    this.pos=np; this.ihi=np;
    // 일치율: 들린 단어가 현재 위치 근처 대본 단어와 닮았는가 (EMA)
    for(const h of best.w){
      let ok=0; for(let j=Math.max(0,np-12);j<Math.min(this.N,np+3);j++) if(sim(h,this.T[j].t)>0){ ok=1; break; }
      this.rate=this.rate*0.9+ok*0.1;
    }
    this.recent=this.recent.concat(best.w).slice(-14);
    this.conf=this.mass(this.b,np,2);
    this.recover();
    return best.w;
  }
  /* 위치를 잃었을 때 자동 복구: 최근 들린 말이 지금 위치와 계속 안 맞고(일치율↓), 다른 곳과 확실히 맞으면 거기로 이동.
     (문장 고정이 '잘 따라가고 있을 때'만 작동하도록, 길을 잃으면 스스로 풀어 준다) */
  recover(){
    if(this.rate>=this.o.lostRate || this.recent.length<8) return false;
    const w=this.recent.slice(-10), u=new Float64Array(this.N+1).fill(1/(this.N+1));
    const r=this.run(u,w,null), a=this.argmax(r.b);
    if(Math.abs(a-this.pos)<=6 || this.mass(r.b,a,3)<0.5) return false;
    const big=this.secAt(a)!==this.secAt(this.pos);
    if(this.evidence(w,a)<(big?8:5)) return false;
    this.b=r.b; this.pos=a; this.ihi=a; this.pend=null; this.sugg=null; this.rate=0.7; this.recent=this.recent.slice(-4); this.last=w[w.length-1]; this.recovered=true;
    return true;
  }
  /* 들리는 중인 마지막 단어는 아직 덜 들린 조각일 수 있음("playi"→playing): 기대하는 대본 단어로 완성해서 본다 */
  fixTail(w){
    const l=w.length; if(!l) return w;
    const h=w[l-1];
    if(h.length<2 || this.vocab.has(h)) return w;
    for(let j=Math.max(0,this.pos+l-4); j<=Math.min(this.N-1,this.pos+l+3); j++){
      const t=this.T[j].t;
      if(t.length>h.length && t.startsWith(h)){ const o=w.slice(); o[l-1]=t; return o; }
    }
    return w;
  }
  /* 말하는 도중(interim) 미리 따라가기: 확정 위치 기준, 뒤로는 가지 않고, 같은 문장 안에서만 움직임.
     다른 문장으로는 아주 확실할 때만 이동 */
  interim(text){
    let w=this.words(text);
    if(!w.length) return this.pos;
    w=this.fixTail(w);
    const al=this.allowedFor(this.pos);
    this.allow=al;
    const r=this.run(this.mask(this.b,al),w,this.last); this.allow=null;
    let np=this.argmax(r.b);
    if(w.length>=7){                                           // 길게 말했는데 문장 밖 대본과 확실히 맞으면 이동
      const r2=this.run(this.b,w,this.last), np2=this.argmax(r2.b);
      if(np2>this.pos && this.isCross(np2,al)){
        const big=this.secAt(np2)!==this.secAt(this.pos), E=this.evidence(w,np2);
        const ok = big ? (w.length>=10 && E>=8 && this.mass(r2.b,np2,2)>=0.6) : (E>=4 && this.mass(r2.b,np2,2)>=0.6);
        if(ok) np=np2;
      }
    }
    // 방금 읽은 문장을 처음부터 다시 읽는 중: 확정(final)을 기다리지 않고 4단어째부터 빨간줄을 되돌림
    if(np<this.pos-this.o.backTol && w.length>=4 && this.mass(r.b,np,2)>=0.6 && this.evidence(w,np)>=3){ this.ihi=np; return np; }
    if(this.isNoise(w,np)) return Math.max(this.pos,this.ihi);          // 잠깐 엉뚱하게 들린 중간 결과: 빨간줄을 뒤로 되돌리지 않고 지금 표시 위치 유지
    np=Math.max(this.pos,np);
    // 중간 인식은 말하는 중에 오락가락하므로, 조금 줄어드는 것은 무시(위치가 깜빡이지 않게)
    if(np<this.ihi && this.ihi-np<=4 && this.ihi<this.N && this.allowedFor(this.pos)[this.T[Math.max(0,this.ihi-1)].sent]) np=this.ihi;
    this.ihi=np;
    return np;
  }
  /* 위치를 잃었을 때: 최근 들린 말 전체로 대본 어디인지 다시 찾기 (수동 R 키/버튼) */
  resync(){
    const w=this.recent.slice(-10);
    if(w.length<3) return false;
    const u=new Float64Array(this.N+1).fill(1/(this.N+1));
    const r=this.run(u,w,null), a=this.argmax(r.b);
    if(this.mass(r.b,a,3)<0.4) return false;
    this.b=r.b; this.pos=a; return true;
  }
}

return {norm, sim, phon, prep, makeModel, Tracker, P, STOP, NAME, FILLER};
})();
if(typeof module!=="undefined" && module.exports) module.exports=Core;

</script>
<script>
/* =====================================================================
   APP — 화면 만들기 · 음성 인식 연결 · 옆 화면(슬라이드) · 타이머 · 설정/단축키
   (위치 추적 로직은 위의 Core 에 있습니다)
   ===================================================================== */
(function(){
"use strict";

/* 오류 안전망: 예외가 나도 화면이 멈추지 않게 상태줄에만 짧게 알린다 (1.5초에 한 번만) */
let _lastErrAt=0, _errCount=0;
function reportError(err){
  try{
    _errCount++;
    console.error(err);
    const t=Date.now(); if(t-_lastErrAt<1500) return; _lastErrAt=t;
    const st=document.getElementById("status");
    if(st){ st.textContent="⚠ 오류가 났지만 계속 진행해요 (R 또는 읽는 곳 클릭)"; st.classList.add("warnTxt"); }
  }catch(e){}
}
const model   = Core.makeModel(DATA);
const {tokens, sents, secs, blocks, N} = model;
const tracker = new Core.Tracker(model);
const $ = id => document.getElementById(id) || (()=>{ try{ console.warn("missing element #"+id); }catch(e){} return document.createElement("div"); })();
const tokAt = i => tokens[clamp(i|0,0,N-1)];          // 항상 유효한 토큰을 돌려줌
const clamp = (v,a,b)=>{ v=+v; if(!isFinite(v)) v=a; return Math.max(a,Math.min(b,v)); };
const now = ()=>performance.now();

/* ---------- 슬라이드 정보 ---------- */
// 슬라이드 번호는 대본 순서(1,2,3…)로 매긴다 — 라벨 숫자가 이상해도 화면이 깨지지 않게
const secSlide  = secs.map((s,i) => i);
const slideSec  = secs.map((s,i) => i);     // 슬라이드 번호 → 섹션 번호
const SLIDE_COUNT = Math.max(1, Math.min(secs.length, (typeof SLIDE_IMG!=="undefined" && SLIDE_IMG.length) || 0, (typeof SLIDE_THUMB!=="undefined" && SLIDE_THUMB.length) || 0) || secs.length);
const imgOf   = i => (typeof SLIDE_IMG!=="undefined" && SLIDE_IMG[i]) || "";
const thumbOf = i => (typeof SLIDE_THUMB!=="undefined" && SLIDE_THUMB[i]) || imgOf(i);
const slideName = slideSec.map(i=>{ const t=String(secs[i].data.title||""); return t.indexOf("—")>=0 ? t.split("—").pop().trim() : t; });
const slideCue  = slideSec.map(i=>(secs[i].data.tip||"").split("<br>")[1]||"");
const HELP_HTML = `
  <b>1.</b> Chrome 또는 Edge로 이 파일을 열고 <b>🎤 시작</b>을 누른 뒤 마이크 권한을 <b>허용</b>하세요. (인터넷 연결 필요)<br>
  <b>2.</b> 대본을 읽으면 지금 읽는 단어에 <b>형광펜/빨간 줄</b>이 따라오고 화면이 자동으로 스크롤됩니다. 옆(좁은 화면에서는 위)의 <b>'지금 화면'</b>에는 그 대본에 해당하는 <b>PPT 슬라이드</b>가 자동으로 바뀌어 나옵니다.<br>
  <b>3.</b> 슬라이드의 마지막 단어를 읽으면 <b>➡ 방향키(→) 클릭!</b> 알림이 깜빡이고 '다음 화면' 카드가 빨갛게 켜집니다. 마지막 단어가 인식되지 않아도 말이 잠깐 멈추면 노란 <b>'거의 끝! → 준비'</b>가 먼저 떠요.<br>
  <b>4.</b> 위치가 틀어지면 <b>읽을 단어를 클릭</b>하거나 오른쪽 <b>슬라이드 썸네일</b>을 누르거나 <kbd>R</kbd>(최근 들린 말로 위치 다시 찾기)을 누르세요. 문장을 건너뛰거나 다시 읽어도 몇 단어 뒤면 스스로 위치를 찾아갑니다.<br>
  <b>5.</b> 단축키: <kbd>Space</kbd> 마이크 켜기/끄기 · <kbd>↑</kbd><kbd>↓</kbd> 이전/다음 문장 · <kbd>←</kbd><kbd>→</kbd> 한 단어 이동 · <kbd>[</kbd><kbd>]</kbd> 이전/다음 슬라이드 · <kbd>R</kbd> 위치 다시 찾기 · <kbd>P</kbd> 옆 화면 · <kbd>F</kbd> 집중 모드 · <kbd>H</kbd> '들린 말' · <kbd>J</kbd> 제안/되돌리기 버튼 누르기<br>
  <b>6.</b> ⚠ 이 페이지에 포커스가 있으면 키보드 → 키가 PPT로 가지 않아요. 태블릿·휴대폰·두 번째 모니터에 띄워두는 것을 추천합니다.<br>
  <b>7.</b> <b>슬라이드 고정:</b> 한 슬라이드를 읽는 동안에는 다른 슬라이드 대본과 비슷한 말이 한두 번 섞여 들려도 따라가지 않아요. 아래에 <b>'○번 대본 같아요'</b> 버튼만 떠요(<kbd>J</kbd>로 누를 수 있어요). 정말로 다른 슬라이드를 두 문장쯤 읽으면 자동으로 이동하고, 그땐 <b>'되돌리기'</b> 버튼(<kbd>J</kbd>)이 떠요. 슬라이드를 끝까지 읽으면 다음 슬라이드로 저절로 넘어갑니다.<br>
  <b>8.</b> 인식률 팁: 조용한 곳에서 이어폰 마이크나 헤드셋을 쓰고, 평소보다 또박또박 일정한 속도로 읽으세요. 상단의 <b>일치 %</b>가 계속 낮으면 마이크 위치를 점검하고, ⚙ 설정에서 <b>인식 언어(억양)</b>를 바꿔 보세요.`;

/* ---------- 화면 만들기 ---------- */
const main = $("script");
const sentEls = [], secEls = [], spanList = [], tokSpan = new Int32Array(N), badgeEls=[];
blocks.forEach(b=>{
  if(b.kind==="part"){
    const h=document.createElement("div"); h.className="partTitle"; h.textContent=b.data.title; main.appendChild(h); return;
  }
  if(b.kind==="help"){
    const box=document.createElement("div"); box.className="sec"; box.id="help";
    box.innerHTML = HELP_HTML; main.appendChild(box); return;
  }
  const sec=secs[b.sec], d=sec.data;
  const el=document.createElement("section"); el.className="sec";
  const head=document.createElement("div"); head.className="secHead";
  head.innerHTML=`<span class="secLabel">${d.label}</span><span class="secTitle">${d.title}</span>`;
  el.appendChild(head);
  if(d.tip){ const t=document.createElement("div"); t.className="tip"; t.innerHTML=d.tip; el.appendChild(t); }
  sec.sents.forEach(si=>{
    const sent=sents[si], p=document.createElement("p"); p.className="sent";
    sent.parts.forEach((part,pi)=>{
      if(pi) p.appendChild(document.createTextNode(" "));
      const sp=document.createElement("span"); sp.className="w"; sp.textContent=part.text;
      if(part.first>=0){
        const idx=spanList.length; spanList.push({el:sp, first:part.first, last:part.last, sent:si});
        for(let t=part.first;t<=part.last;t++) tokSpan[t]=idx;
        sp.addEventListener("click",()=>{ try{ setPos(part.last+1); }catch(err){ reportError(err); } });
      } else sp.classList.add("x");
      p.appendChild(sp);
    });
    sentEls[si]=p; el.appendChild(p);
  });
  { const bd=document.createElement("div"); bd.className="endBadge"; bd.textContent=d.endMsg||"➡ 다음 슬라이드! 방향키(→) 클릭";
    el.appendChild(bd); badgeEls[b.sec]=bd; }
  secEls[b.sec]=el; main.appendChild(el);
});

/* ---------- 옆 화면 (PPT 슬라이드) ---------- */
const curImg=$("curImg"), nextImg=$("nextImg"), strip=$("strip");
const stripBtns=[];
for(let i=0;i<SLIDE_COUNT;i++){
  const b=document.createElement("button"); b.type="button"; b.title=`Slide ${i+1} · ${slideName[i]}`;
  b.innerHTML=`<img alt="" src="${thumbOf(i)}"><b>${i+1}</b>`;
  b.addEventListener("click",()=>{ try{ setPos(secs[slideSec[i]].first,true,true); }catch(err){ reportError(err); } b.blur(); });
  strip.appendChild(b); stripBtns.push(b);
}
for(let i=0;i<SLIDE_COUNT;i++){ try{ const src=imgOf(i); if(!src) continue; const im=new Image(); im.src=src; if(im.decode) im.decode().catch(()=>{}); }catch(err){} }   // 미리 디코딩 → 전환이 즉시 보임
let shownSlide=-1;
function setSlide(i, secIdx){
  i = clamp(i,0,SLIDE_COUNT-1);
  if(i!==shownSlide){
    curImg.src=imgOf(i); curImg.classList.remove("pop"); void curImg.offsetWidth; curImg.classList.add("pop");
    nextImg.src=imgOf(Math.min(SLIDE_COUNT-1,i+1));
    stripBtns.forEach((b,k)=>{ b.classList.toggle("cur",k===i); b.classList.toggle("done",k<i); });
    $("sideNo").textContent=`${i+1} / ${SLIDE_COUNT}`;
    const ns = i<SLIDE_COUNT-1 ? secs[slideSec[i+1]] : null;
    if(ns){
      $("nextTag").textContent="다음 화면"; $("nextName").textContent=`Slide ${i+2} · ${slideName[i+1]}`;
      $("nextText").textContent = ns.sents.length ? sents[ns.sents[0]].parts.map(p=>p.text).join(" ") : "";
    } else {
      $("nextTag").textContent="마지막 화면"; $("nextName").textContent="여기가 마지막 슬라이드예요";
      $("nextText").textContent="마무리 인사까지 읽으면 끝! 🎉";
    }
    shownSlide=i;
  }
  $("capName").textContent = `Slide ${i+1} · ${slideName[i]}`;
  const cueTxt = slideCue[i];
  $("cue").innerHTML = cueTxt || ""; $("cue").style.display = cueTxt ? "" : "none";
}

/* ---------- 표시 갱신 ---------- */
let shown=-1, shownAhead=false, dispCt=0, readCount=0, curSpan=-1, curSent=-1, nextSent=-1, curSec=-1, lastScrollSent=-1, userScrollUntil=0;
const nextAlert=$("nextAlert"), slideInfo=$("slideInfo"), nextCard=$("nextCard");
let lastSpeech=0, alertLevel=0, alertSec=-1, alertFired=0;

/* ahead=true : 점프 직후처럼 "다음에 읽을 단어"(p번째)를 현재 위치로 표시 / false : 방금 읽은 단어(p-1번째) */
function render(p, forceScroll, ahead){
  p=clamp(p,0,N);
  if(p===shown && !forceScroll) return;
  shown=p; shownAhead=!!ahead && p<N;
  const realCt = shownAhead ? p : Math.max(0,p-1);
  dispCt=clamp(realCt,0,N-1);                      // 실제 위치(알림·진행률 등은 이 값 기준)
  // 한 단어 앞서 표시: 인식이 늦게 오는 만큼 '지금 읽을 단어'에 표시 (같은 문장 안에서만)
  const lead = (S.lead && !shownAhead && p>0 && p<N && tokens[p] && tokens[p-1] && tokens[p].sent===tokens[p-1].sent) ? 1 : 0;
  const ct = clamp(realCt+lead,0,N-1), tk=tokens[ct];
  // 읽은 단어 흐리게 (바뀐 구간만)
  let rc=readCount;
  while(rc<spanList.length && spanList[rc].last<realCt) rc++;
  while(rc>0 && spanList[rc-1].last>=realCt) rc--;
  if(p===0) rc=0;
  if(rc>readCount) for(let i=readCount;i<rc;i++) spanList[i].el.classList.add("read");
  else for(let i=rc;i<readCount;i++) spanList[i].el.classList.remove("read");
  readCount=rc;
  // 현재 단어 / 문장 / 섹션
  const sp = (p>0 || shownAhead) ? tokSpan[ct] : -1;   // 단어 span 이 없는 토큰이면 -1 대신 0 이 올 수 있어 아래에서 확인
  if(curSpan!==sp){ if(curSpan>=0&&spanList[curSpan]) spanList[curSpan].el.classList.remove("cur"); if(sp>=0&&spanList[sp]) spanList[sp].el.classList.add("cur"); curSpan=sp; }
  if(curSent!==tk.sent){
    if(curSent>=0&&sentEls[curSent]) sentEls[curSent].classList.remove("active");
    if(nextSent>=0&&sentEls[nextSent]) sentEls[nextSent].classList.remove("nextSent");
    if(sentEls[tk.sent]) sentEls[tk.sent].classList.add("active"); curSent=tk.sent;
    nextSent = tk.sent+1<sents.length ? tk.sent+1 : -1;
    if(nextSent>=0&&sentEls[nextSent]) sentEls[nextSent].classList.add("nextSent");
  }
  const sec=secs[tk.sec];
  if(curSec!==tk.sec){
    if(curSec>=0&&secEls[curSec]) secEls[curSec].classList.remove("activeSec");
    if(secEls[tk.sec]) secEls[tk.sec].classList.add("activeSec"); curSec=tk.sec;
    setSlide(secSlide[tk.sec], tk.sec);
  }
  slideInfo.textContent = `${sec.data.label} / ${SLIDE_COUNT}`;
  const pg=$("progress").firstElementChild; if(pg) pg.style.width=(p/N*100).toFixed(1)+"%";
  updateAlert();
  scrollTo_(forceScroll, sp>=0&&spanList[sp]?spanList[sp].el:sentEls[tk.sent], tk.sent);
}
function scrollTo_(force, target, sentIdx){
  if(!target) return;
  if(!S.autoScroll && !force) return;
  if(!force && now()<userScrollUntil) return;
  const r=target.getBoundingClientRect(), vh=window.innerHeight, barH=$("bar").offsetHeight + (innerWidth<=980&&!S.noSide? $("side").offsetHeight:0);
  const topLim=barH+vh*0.06, botLim=vh*0.64;
  if(force || sentIdx!==lastScrollSent || r.top<topLim || r.bottom>botLim){
    const to=window.scrollY + r.top - (barH + (vh-barH)*0.26);
    try{ window.scrollTo({top:to, behavior: Math.abs(to-window.scrollY)>vh*1.4 ? "instant" : "smooth"}); }catch(err){ window.scrollTo(0,to); }   // 멀리 점프할 땐 바로 이동
    lastScrollSent=sentIdx;
  }
}
let livePos=0;
function setPos(p, scroll, ahead){
  p=clamp(p,0,N); tracker.setPos(p); livePos=p; userScrollUntil=0;
  if(listening) setStatus("🎙 듣는 중…");
  render(p, scroll!==false, ahead);
}

/* ---------- 방향키 알림 ---------- */
function updateAlert(){
  const p=shown<0?0:shown, ct=dispCt, tk=tokAt(ct), sec=secs[tk.sec];
  const isSlide=true, moved=p>0 && !shownAhead;
  const hard = moved && isSlide && ct===sec.last;
  const silent = now()-lastSpeech>1400;
  const soft = !hard && moved && isSlide && listening && ct>=sec.last-1 && silent;     // 마지막 단어가 인식 안 됐어도, 말이 멈추면 알려줌
  const level = hard?2 : soft?1 : 0;
  if(tk.sec!==alertSec){ alertSec=tk.sec; alertFired=0; }
  nextAlert.classList.toggle("show", level>0);
  nextAlert.classList.toggle("soft", level===1);
  nextAlert.textContent = level===2 ? (sec.data.endMsg || "➡ 방향키(→) 클릭!") : level===1 ? "거의 끝! → 준비" : "";
  nextCard.classList.toggle("armed", level===2);
  nextCard.classList.toggle("soft", level===1);
  if(badgeEls[tk.sec]) badgeEls[tk.sec].classList.toggle("show", level===2);
  if(level>alertFired){ alertFired=level; if(level===2) cue(); }
  alertLevel=level;
}
let audioCtx=null;
function cue(){
  if(!S.beep) return;
  try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.value=.0001; o.connect(g); g.connect(audioCtx.destination);
    const t=audioCtx.currentTime; g.gain.exponentialRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.28); o.start(t); o.stop(t+.3);
  }catch(e){}
}

/* ---------- 주기 점검 (0.25초마다) ---------- */
const timerEl=$("timer");
let listenMs=0, tLast=0;
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function tick(){
  try{
    const t=now(), dt=tLast? Math.min(t-tLast,2000) : 0; tLast=t;     // 탭이 멈췄다 돌아와도 시간이 확 뛰지 않게
    if(listening){ listenMs+=dt; timerEl.textContent=fmt(listenMs); timerEl.classList.toggle("over",listenMs>=180000); }
    updateAlert();      // 말이 멈춘 뒤 '거의 끝' 판단
    decayHints();
  }catch(err){ reportError(err); }
}

/* ---------- 다른 슬라이드 대본 제안 / 자동 이동 되돌리기 ---------- */
const jumpHint=$("jumpHint"); let hintMode="", hintPos=0, hintSec=-1, hintAt=0;
function showHint(mode,pos,sec,text){
  hintMode=mode; hintPos=pos; hintSec=sec; hintAt=now();
  jumpHint.textContent=text; jumpHint.classList.toggle("undo",mode==="undo"); jumpHint.classList.add("show");
}
function hideHint(){ jumpHint.classList.remove("show"); hintMode=""; hintSec=-1; }
function syncHints(){                      // 음성 인식 결과를 받을 때마다 호출
  const ac=tracker.autoCross;
  if(ac){ tracker.autoCross=null; showHint("undo",ac.from,-1,`↩ 슬라이드 ${secSlide[tokAt(ac.to-1).sec]+1} 대본으로 옮겼어요 — 틀렸다면 눌러서 되돌리기 (J)`); return; }
  const sg=tracker.sugg;
  if(sg && sg.sec!==tokAt(dispCt).sec){
    if(hintMode!=="go" || hintSec!==sg.sec) showHint("go",sg.np,sg.sec,`📍 슬라이드 ${secSlide[sg.sec]+1} 대본을 읽는 것 같아요 — 눌러서 이동 (J)`);
    else { hintPos=sg.np; hintAt=now(); }
  } else if(hintMode==="go") hideHint();
}
function acceptHint(){
  if(!hintMode) return false;
  const m=hintMode, p=hintPos; hideHint();
  setPos(p,true,false);
  if(m==="go") setStatus("📍 이동했어요");
  return true;
}
function decayHints(){
  if(hintMode && now()-hintAt>(hintMode==="undo"?15000:10000)) hideHint();
  if(hintMode==="go" && tokAt(dispCt).sec===hintSec) hideHint();
}
jumpHint.addEventListener("click",()=>{ try{ acceptHint(); }catch(err){ reportError(err); } jumpHint.blur(); });

/* ---------- 음성 인식 (Web Speech API) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn=$("micBtn"), statusEl=$("status");
const heardFinal=$("heardFinal"), heardInterim=$("heardInterim");
let rec=null, listening=false, heardLog=[], wakeLock=null, doneIdx=0, quickEnds=0, lastStart=0;

if(!SR){
  const w=$("warn"); w.style.display="block";
  w.innerHTML="⚠ 이 브라우저는 음성인식을 지원하지 않아요. <b>Chrome</b> 또는 <b>Edge</b>로 열어주세요. (단어 클릭·방향키로 수동 이동은 가능)";
  micBtn.disabled=true; micBtn.style.opacity=.5;
}
function setStatus(txt, warn){ statusEl.textContent=txt; statusEl.classList.toggle("warnTxt",!!warn); }
function altsOf(r){ const a=[]; for(let k=0;k<r.length;k++) if(r[k] && r[k].transcript) a.push(r[k].transcript); return a; }
function qualityText(){
  const rate=tracker.rate;
  if(tracker.n>=8 && rate<0.35) return ["⚠ 잘 안 들려요 — 읽는 곳을 탭하거나 R", true];
  return ["🎙 듣는 중 · 일치 "+Math.round(clamp(rate,0,1)*100)+"%", false];
}
function startSession(){
  const me = new SR();
  rec = me;
  me.lang=S.lang||"en-US"; me.continuous=true; me.interimResults=true; me.maxAlternatives=5;
  doneIdx=0; lastStart=now();
  me.onstart=()=>{ if(rec!==me) return; setStatus("🎙 듣는 중…"); };
  me.onresult=(e)=>{
    if(rec!==me) return;                                  // 이미 교체된(낡은) 인식기의 결과는 무시
    try{
      lastSpeech=now();
      let inter="";
      const results=e.results||[];
      if(doneIdx>results.length) doneIdx=0;               // 새 세션인데 번호가 남아 있으면 처음부터
      for(let i=doneIdx;i<results.length;i++){
        const r=results[i]; if(!r) continue;
        if(r.isFinal){
          const w=tracker.final(altsOf(r)); doneIdx=i+1;
          if(w.length){ heardLog.push(...w); heardLog=heardLog.slice(-30); heardFinal.textContent=heardLog.slice(-14).join(" "); }
        } else if(r[0] && r[0].transcript) inter+=" "+r[0].transcript;
      }
      const iw=tracker.words(inter);
      heardInterim.textContent=iw.join(" ");
      livePos = iw.length ? tracker.interim(inter) : tracker.pos;     // 말하는 도중에도 미리 따라가기
      const q=qualityText(); setStatus(q[0],q[1]);
      render(livePos);
      syncHints();
    }catch(err){
      reportError(err);
      try{ tracker.safeReset(); livePos=tracker.pos; render(tracker.pos,false); }catch(e2){}   // 내부 상태만 정리하고 계속 진행
    }
  };
  me.onerror=(e)=>{
    if(rec!==me) return;
    const code=(e&&e.error)||"";
    if(code==="not-allowed"||code==="service-not-allowed"){ listening=false; setStatus("⛔ 마이크 권한이 필요해요",true); updateBtn(); releaseWake(); }
    else if(code==="audio-capture"){ listening=false; setStatus("⛔ 마이크를 찾을 수 없어요",true); updateBtn(); releaseWake(); }
    else if(code==="network"){ setStatus("⚠ 인터넷 연결 확인",true); }
    else if(code!=="no-speech" && code!=="aborted"){ setStatus("⚠ "+code,true); }
  };
  me.onend=()=>{
    if(rec!==me) return;
    // 크롬은 일정 시간 지나면 인식을 끊기 때문에 자동으로 다시 켬 (너무 빨리 반복되면 잠깐 쉼)
    if(listening){
      quickEnds = (now()-lastStart<800) ? quickEnds+1 : 0;
      scheduleRestart(quickEnds>=3 ? 1200 : 120);
    } else setStatus("⏸ 일시정지");
  };
  me.start();                                             // 이미 켜져 있으면 예외 → 호출한 쪽에서 처리
  restartFails=0;
}
let restartTimer=null, restartFails=0;
function scheduleRestart(delay){
  if(restartTimer) clearTimeout(restartTimer);
  restartTimer=setTimeout(()=>{
    restartTimer=null;
    if(!listening) return;
    try{ startSession(); }
    catch(err){                                           // 다시 켜지 못하면 멈추지 말고 몇 번 더 시도, 계속 실패하면 정지
      if(++restartFails>=5){ listening=false; updateBtn(); releaseWake(); setStatus("⚠ 음성 인식을 다시 켜지 못했어요 — 🎤 시작을 다시 눌러 주세요",true); }
      else { setStatus("⚠ 음성 인식 재연결 중…",true); scheduleRestart(700); }
    }
  }, delay);
}
function releaseWake(){ if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; } }
function stopRec(abort){
  const r=rec;
  if(!r) return;
  try{ abort ? r.abort() : r.stop(); }catch(e){ if(abort){ try{ r.stop(); }catch(e2){} } }
}
function updateBtn(){ micBtn.textContent = listening ? "⏹ 멈춤" : "🎤 시작"; micBtn.classList.toggle("on", listening); }
let micBusy=false;
async function toggleMic(){
  if(!SR || micBusy) return;
  micBusy=true;
  try{
    if(listening){
      listening=false;
      if(restartTimer){ clearTimeout(restartTimer); restartTimer=null; }
      stopRec(false);
      releaseWake();
      setStatus("⏸ 일시정지");
    } else {
      listening=true; quickEnds=0; restartFails=0; lastSpeech=now();
      try{ startSession(); }
      catch(err){
        listening=false; reportError(err);
        setStatus("⚠ 음성 인식을 시작하지 못했어요 — 잠시 후 다시 눌러 주세요",true);
      }
      if(listening){
        try{ if("wakeLock" in navigator && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
      }
    }
  } finally { micBusy=false; updateBtn(); }
}
micBtn.addEventListener("click",()=>{ toggleMic().catch(reportError); micBtn.blur(); });
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState==="visible" && listening && "wakeLock" in navigator && navigator.wakeLock){ try{ wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
});

/* ---------- 설정 / 저장 ---------- */
const body=document.body;
let S={};
try{ const raw=JSON.parse(localStorage.getItem("scriptFollowerV3")||"{}"); S=(raw && typeof raw==="object" && !Array.isArray(raw)) ? raw : {}; }catch(e){ S={}; }
function save(){ try{ localStorage.setItem("scriptFollowerV3", JSON.stringify(S)); }catch(e){} }
const D={mode:"both", fs:28, sideSize:"M", noSide:false, noTips:false, noHeard:false, focus:false, autoScroll:true, beep:false, lang:"en-US", lead:true};
// 저장된 값에서 쓰는 항목만 가져오고, 값이 이상하면(다른 버전·손상) 기본값으로 되돌림
(function(){
  const saved=S, out=Object.assign({},D);
  Object.keys(D).forEach(k=>{ if(typeof saved[k]===typeof D[k]) out[k]=saved[k]; });
  if(!["both","hl","ul"].includes(out.mode)) out.mode=D.mode;
  if(!["S","M","L"].includes(out.sideSize)) out.sideSize=D.sideSize;
  if(!["en-US","en-GB","en-AU","en-IN"].includes(out.lang)) out.lang=D.lang;
  out.fs = clamp(Math.round(out.fs),18,52);
  S=out;
})();
const hlMode=$("hlMode"), fontSize=$("fontSize"), fontSize2=$("fontSize2");
function applySettings(){
  body.classList.remove("m-both","m-hl","m-ul"); body.classList.add("m-"+S.mode); hlMode.value=S.mode;
  fontSize.value=S.fs; fontSize2.value=S.fs; document.documentElement.style.setProperty("--fs", S.fs+"px");
  body.classList.toggle("noTips", S.noTips);
  body.classList.toggle("noHeard", S.noHeard);
  body.classList.toggle("noSide", S.noSide);
  body.classList.toggle("sideS", S.sideSize==="S"); body.classList.toggle("sideL", S.sideSize==="L");
  body.classList.toggle("focusMode", S.focus);
  $("sideSize").value=S.sideSize; $("lang").value=S.lang;
  $("swSide").checked=!S.noSide; $("swFocus").checked=S.focus; $("swTips").checked=!S.noTips; $("swHeard").checked=!S.noHeard;
  $("swScroll").checked=S.autoScroll; $("swBeep").checked=S.beep; $("swLead").checked=S.lead;
}
hlMode.addEventListener("change",()=>{ S.mode=hlMode.value; save(); applySettings(); hlMode.blur(); });
[fontSize,fontSize2].forEach(el=>{
  el.addEventListener("input",()=>{ S.fs=clamp(Math.round(+el.value||D.fs),18,52); save(); applySettings(); });
  el.addEventListener("change",()=>{ el.blur(); try{ render(shown<0?0:shown,true,shownAhead); }catch(err){ reportError(err); } });
});
$("sideSize").addEventListener("change",e=>{ S.sideSize=e.target.value; save(); applySettings(); e.target.blur(); });
$("lang").addEventListener("change",e=>{ S.lang=e.target.value; save(); e.target.blur(); if(listening) stopRec(false); });     // 끝나면 자동으로 새 언어로 다시 시작
const toggles={swLead:v=>{S.lead=v; render(shown<0?0:shown,true,shownAhead);}, swSide:v=>S.noSide=!v, swFocus:v=>S.focus=v, swTips:v=>S.noTips=!v, swHeard:v=>S.noHeard=!v, swScroll:v=>S.autoScroll=v, swBeep:v=>{S.beep=v; if(v) cue();}};
Object.keys(toggles).forEach(id=>$(id).addEventListener("change",e=>{ try{ toggles[id](e.target.checked); save(); applySettings(); }catch(err){ reportError(err); } e.target.blur(); }));
const settingsEl=$("settings");
$("settingsBtn").addEventListener("click",e=>{ settingsEl.hidden=!settingsEl.hidden; e.currentTarget.blur(); });
document.addEventListener("click",e=>{ if(!settingsEl.hidden && !settingsEl.contains(e.target) && !e.target.closest("#settingsBtn")) settingsEl.hidden=true; });

function resync(){
  let ok=false; try{ ok=tracker.resync(); }catch(err){ reportError(err); }
  if(ok){ setPos(tracker.pos,true); setStatus("📍 위치를 다시 찾았어요"); }
  else setStatus("📍 아직 단서가 부족해요 — 몇 단어 더 읽어 주세요",true);
}
$("resyncBtn").addEventListener("click",e=>{ resync(); e.currentTarget.blur(); });

/* 이동 메뉴 */
const jump=$("jump");
jump.innerHTML = `<option value="">📍 이동…</option>` + secs.map((s,i)=>`<option value="${i}">${s.data.label} · ${slideName[secSlide[i]]}</option>`).join("");
jump.addEventListener("change",()=>{ try{ const sc=secs[+jump.value]; if(jump.value!=="" && sc) setPos(sc.first, true, true); }catch(err){ reportError(err); } jump.value=""; jump.blur(); });

/* 처음으로 */
/* 전부 처음 상태로: 위치 · 들린 말 · 알림 */
function resetAll(){
  tracker.reset(0); setPos(0,false);
  listenMs=0; tLast=0; timerEl.textContent="00:00"; timerEl.classList.remove("over");
  heardLog=[]; heardFinal.textContent=""; heardInterim.textContent=""; hideHint();
  lastSpeech=0; alertFired=0; alertSec=-1;
  window.scrollTo({top:0,behavior:"smooth"});
}
$("resetBtn").addEventListener("click",(e)=>{ e.currentTarget.blur(); try{ resetAll(); }catch(err){ reportError(err); } });

/* 재시도: 위치를 모두 처음으로 되돌리고, 음성 인식도 새로 시작 */
$("retryBtn").addEventListener("click",(e)=>{
  e.currentTarget.blur();
  try{
    if((listening || shown>0) && !confirm("재시도할까요?\n읽은 위치가 처음으로 돌아가고, 음성 인식도 새로 시작해요.")) return;
    resetAll();
    quickEnds=0; doneIdx=0;
    if(listening){
      setStatus("🔄 음성 인식을 다시 시작하는 중…");
      stopRec(true);      // onend 가 자동으로 새 세션을 시작함
    } else setStatus("🔄 처음부터 다시 — 🎤 시작을 눌러 주세요");
  }catch(err){ reportError(err); }
});

/* 사용자가 직접 스크롤하면 잠깐 자동 스크롤을 멈춤 */
["wheel","touchmove"].forEach(ev=>window.addEventListener(ev,()=>{ userScrollUntil=now()+3500; },{passive:true}));

/* 단축키 */
document.addEventListener("keydown",(e)=>{
  try{
    const tg=(e.target&&e.target.tagName)||"";
    if(tg==="INPUT"||tg==="SELECT"||tg==="TEXTAREA") return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const ct=dispCt, curS=tokAt(ct).sent, secI=tokAt(ct).sec, p=shown<0?0:shown;
    if(e.code==="Space"){ e.preventDefault(); if(!e.repeat) toggleMic().catch(reportError); }
    else if(e.key==="Escape"){ settingsEl.hidden=true; }
    else if(e.key==="ArrowDown"){ e.preventDefault(); if(curS+1<sents.length) setPos(sents[curS+1].first,true,true); }
    else if(e.key==="ArrowUp"){ e.preventDefault();               // 문장 중간이면 그 문장 처음으로, 이미 처음이면 이전 문장으로
      const n = ct>sents[curS].first ? curS : Math.max(0,curS-1);
      setPos(sents[n].first,true,true); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); setPos((p===0&&!shownAhead)?1:ct+2); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); setPos(ct); }
    else if(e.key==="]"||e.key==="PageDown"){ e.preventDefault(); if(secI+1<secs.length) setPos(secs[secI+1].first,true,true); }
    else if(e.key==="["||e.key==="PageUp"){ e.preventDefault(); setPos(secs[(ct-secs[secI].first>2||secI===0)?secI:secI-1].first,true,true); }
    else if(e.key==="h"||e.key==="H"){ S.noHeard=!S.noHeard; save(); applySettings(); }
    else if(e.key==="p"||e.key==="P"){ S.noSide=!S.noSide; save(); applySettings(); }
    else if(e.key==="f"||e.key==="F"){ S.focus=!S.focus; save(); applySettings(); }
    else if(e.key==="r"||e.key==="R"){ resync(); }
    else if(e.key==="j"||e.key==="J"){ acceptHint(); }
  }catch(err){ reportError(err); }
});

/* 상단 바 높이 → 옆 화면 위치 계산에 사용 */
function measureBar(){ document.documentElement.style.setProperty("--barH", $("bar").offsetHeight+"px"); }
if("ResizeObserver" in window) new ResizeObserver(measureBar).observe($("bar")); window.addEventListener("resize",measureBar);

/* 시작 */
applySettings(); measureBar();
render(0,false);
setInterval(tick,250);
window.addEventListener("error", ev=>{ reportError(ev&&(ev.error||ev.message)); });
window.addEventListener("unhandledrejection", ev=>{ reportError(ev&&ev.reason); });

// 테스트/디버그용으로 일부 상태를 노출
window.__follower = {tracker, model, render, setPos, get pos(){return shown;}, get level(){return alertLevel;}};
})();

</script>
</body>
</html>
